# Levanta sigeru-backend con "docker compose up":
#   - web:  Apache+PHP en http://localhost:8080, sirviendo las 3 APIs
#           (las mismas rutas que hoy en XAMPP).
#   - db:   MySQL 8 con 01_code.sql ya cargado la primera vez que se crea el volumen.
#
# Los 3 frontends (landing, frontend-usuarios, backoffice) viven en el
# repo separado sigeru-frontend, con su propio Docker (ver ese repo).
#
# La primera vez, o despues de "docker compose down -v", hace falta un
# administrador para poder aprobar solicitudes/entrar al panel - ver
# claude/plan_pasos_correccion.md (quinta vuelta) para el script de alta.
#
# Contraseña de MySQL root (06/10/2026, ítem 11 de seguridad): antes
# estaba escrita acá abajo directo ("sigeru_docker") y se repetía en los
# 3 archivos docker/env/*.env que se montaban adentro de cada API -
# cualquiera que mirara el repo la veía. Ahora sale de MYSQL_ROOT_PASSWORD
# (ver .env.example en esta misma carpeta: copiá ese archivo a ".env",
# al lado de este docker-compose.yml, y poné una contraseña real -
# "docker compose up" la lee sola, no hace falta exportar nada a mano).
# Los 3 archivos docker/env/*.env ya no existen: "web" recibe las
# credenciales como variables de entorno reales (ver más abajo), y
# Conexion.php (las 3 APIs) las lee con getenv() antes que de un .env -
# el .env propio de cada API (Application/Configuration/.env) sigue
# existiendo igual que siempre, para cuando el proyecto corre en XAMPP.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copiá .env.example a .env (en esta carpeta) y definí una contraseña}
      MYSQL_DATABASE: SiGeRU
    volumes:
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
      - db-datos:/var/lib/mysql
    ports:
      - "3307:3306"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      # Mismas credenciales que "db" de arriba - Conexion.php (las 3 APIs)
      # las toma con getenv() en vez de un .env montado por volumen.
      DB_HOST: db
      DB_NAME: SiGeRU
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:?Copiá .env.example a .env (en esta carpeta) y definí una contraseña}
    volumes:
      - .:/var/www/html

volumes:
  db-datos:
