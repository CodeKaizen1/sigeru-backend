; Configuración mínima de PHP para la imagen Docker -- Fase 1 punto 7 de la
; auditoría 08/10/2026. Por defecto la imagen php:8.2-apache trae
; display_errors=On, que en producción muestra rutas de archivo y
; consultas SQL crudas si algo no capturado explota -- la aplicación ya
; devuelve mensajes de error genéricos al cliente (ver auditoría previa,
; "raw exception messages leaked", ya resuelto), pero esto es la segunda
; capa de defensa a nivel de PHP mismo, para cualquier error que la
; aplicación no llegue a capturar.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off
